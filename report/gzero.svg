<?xml version="1.0" encoding="utf-8"?>
<!--
  Gradient Zero G0 mark, used on the report cover and the signature page under
  "Hosted by". Source: https://gzero.ai/assets/favicon.svg (the company's own
  site); same artwork as assets/g0-mark.svg.

  Changes vs. the original, all deliberate:
   1. The brand dark tile (a rounded rect in #0a0b10) is dropped, so the mark
      sits on the paper: background transparent, i.e. white on the page.
   2. The G and 0 are black, not #ffffff, which would be invisible on paper.
      (The brand's own colours for the mark are the light accents g1 #34e0c4
      and g3 #7a5cf0.)
   3. The viewBox is cropped to the artwork's ink bounding box, so the height
      requested in report-idris.tex is the height of the G0 itself. In the stock
      144x144 box, with its tile and scale(0.8), the G0 filled only 47% of it.

  The mark is left exactly as drawn: its G and 0 are interrupted by diagonal
  cuts, and those cuts stay open (white). A version that filled them in light
  purple to make the letters read whole was tried and dropped on 2026-08-19.

  The Makefile converts this file to gzero.pdf (rsvg-convert); LaTeX embeds it.
  Note: rsvg-convert rejects a doubled hyphen inside an XML comment.
-->
